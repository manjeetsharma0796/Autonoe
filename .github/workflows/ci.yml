name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint TODO.md
        run: bun scripts/lint-todo.ts

      - name: Typecheck
        run: bun --filter '*' typecheck

      - name: Test
        run: bun --filter '*' test
